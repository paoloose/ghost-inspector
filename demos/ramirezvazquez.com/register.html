<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro - Ramírez Vázquez Bienes Raíces</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Raleway', sans-serif;
      background: #1b1b1e;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .register-box {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .register-box h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #4e5ac3;
    }
    .register-box p {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 32px;
    }
    .register-box input {
      width: 100%;
      padding: 14px 18px;
      margin-bottom: 16px;
      font-family: 'Raleway', sans-serif;
      font-size: 15px;
      color: #fff;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 4px;
      outline: none;
      transition: border-color 0.3s;
    }
    .register-box input:focus {
      border-color: #4e5ac3;
      background: rgba(255,255,255,0.15);
    }
    .register-box input::placeholder {
      color: rgba(255,255,255,0.4);
    }
    .register-box button {
      width: 100%;
      padding: 14px;
      font-family: 'Raleway', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #fff;
      background: #4e5ac3;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      transition: background 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .register-box button:hover {
      background: #343c82;
    }
    .register-box button:disabled {
      background: #3c3c4e;
      cursor: not-allowed;
    }
    .register-box .back-link {
      display: block;
      margin-top: 20px;
      font-size: 13px;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
    }
    .register-box .back-link:hover {
      color: #4e5ac3;
    }
    .success-msg {
      display: none;
      padding: 20px;
      background: rgba(78,90,195,0.2);
      border: 1px solid #4e5ac3;
      border-radius: 4px;
      font-weight: 600;
    }

    /* Loading spinner */
    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Full-page loader overlay */
    .page-loader {
      position: fixed;
      inset: 0;
      background: rgba(27, 27, 30, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      z-index: 9999;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .page-loader--visible {
      opacity: 1;
      pointer-events: all;
    }
    .page-loader__spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #4e5ac3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .page-loader__text {
      font-size: 14px;
      color: rgba(255,255,255,0.7);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="page-loader" id="pageLoader">
    <div class="page-loader__spinner"></div>
    <div class="page-loader__text">Creando tu cuenta...</div>
  </div>

  <div class="register-box" id="registerBox">
    <h1>Crear Cuenta</h1>
    <p>Regístrate para acceder a contenido exclusivo</p>
    <form id="registerForm">
      <input type="email" id="email" placeholder="Correo electrónico" required autocomplete="email">
      <input type="password" id="password" placeholder="Contraseña" required autocomplete="new-password">
      <button type="submit" id="registerBtn">Registrarse</button>
    </form>
    <div class="success-msg" id="successMsg">
      ¡Registro exitoso! Redirigiendo...
    </div>
    <a href="/" class="back-link">Volver al inicio</a>
  </div>
  <script>
    (function() {
      var form = document.getElementById('registerForm');
      var btn = document.getElementById('registerBtn');
      var loader = document.getElementById('pageLoader');
      var successMsg = document.getElementById('successMsg');

      function showLoader(text) {
        if (text) {
          loader.querySelector('.page-loader__text').textContent = text;
        }
        loader.classList.add('page-loader--visible');
      }

      function hideLoader() {
        loader.classList.remove('page-loader--visible');
      }

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var email = document.getElementById('email').value;
        var password = document.getElementById('password').value;
        if (!email || !password) return;

        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div> Registrando...';
        showLoader('Creando tu cuenta...');

        // Simulate async registration (300-500ms)
        var delay = Math.floor(Math.random() * 301) + 200;
        setTimeout(function() {
          // Store dummy session
          var session = {
            email: email,
            name: email.split('@')[0],
            registeredAt: new Date().toISOString()
          };
          localStorage.setItem('rvbr_session', JSON.stringify(session));

          btn.disabled = false;
          btn.textContent = 'Registrarse';
          form.style.display = 'none';
          successMsg.style.display = 'block';

          showLoader('Redirigiendo al inicio...');

          setTimeout(function() {
            window.location.href = '/';
          }, 600);
        }, delay);
      });
    })();
  </script>
</body>
</html>
